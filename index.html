<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Loading...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #ffffff; /* Layar putih polos */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Spinner Loading Minimalis */
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-top: 4px solid #333333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Ikon Loading di Tengah -->
  <div class="spinner"></div>

  <script>
    // URL Smartlink Anda (Ubah link di bawah ini sesuai smartlink CPA Anda)
    var smartlinkURL = "https://cgiaaag.usdatehub.com/s/133baad435f7a?track=HRS&subsource=HRS";

    // Durasi jeda 0.5 detik (500 milidetik) sebelum otomatis redirect
    setTimeout(function() {
      window.location.replace(smartlinkURL);
    }, 500);

    // Backup: Jika user klik di mana saja, langsung redirect seketika
    document.addEventListener('click', function() {
      window.location.replace(smartlinkURL);
    });
  </script>
</body>
</html>
